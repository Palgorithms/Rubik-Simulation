<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Rubik Cube</title>
  <style>
    :root {
      --sliderScale: 3;
      /* --sliderColor: #ff6600; */
    }
    body {
      height: 100vh;
      /* overflow: hidden; */
      padding: 0;
      margin: 0;
      font-family: Georgia;
    }
    main{
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas{
      border:solid 1px;
      box-sizing:border-box;
    }
    input[type="range"]{
      transform : translate(-50%,-50%) scale(var(--sliderScale));
    }
    input[type="range"]:focus {
      outline: none !important;
    }
    input[type="range"]::-webkit-slider-runnable-track{
      background-color: #000;
      border-radius: 10px;
      border : solid .5px #fff;
      outline : solid .5px #000;
      /* height : 100px; */
    }
    input[type="range"]::-webkit-slider-thumb:hover{
      /* background: #000000 !important; */
      accent-color: #000;
    }
    input[type="range"]:hover{
      cursor : grab;
    }
    input[type="range"]:active{
      cursor : grabbing;
    }
    p{
      font-size: 48px;
      font-weight: bold;
      color : #fff;
      text-shadow: #000 1px 2px 2px;
      margin: 0;
      /* transform: translate(-50%,-50%); */
      /* text-align: center; */
      white-space: nowrap;
      pointer-events: none;
    }
    button.rubikBtn{
      font-size: 40px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      color: #fff;
      background-color: #000;
      border: solid 2px #fff;
      cursor: pointer;
      font-family: Georgia;
    }
    button.rubikBtn:hover{
      background-color : #fff;
      color : #000;
      border-color: #000;
    }
    select{
      transform: translate(-50%,-50%);
      background-color : #000;
      color : #fff;
      font-size: 40px;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 10px;
      font-family: Georgia;
    }
  </style>
  </style>
</head>
<body>
  
  <script src="./p5.min.js"></script>
  <script src="./Cube.js"></script>
  <script src="./sketch.js"></script>
</body>

</html>
